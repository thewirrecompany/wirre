<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connection Lost | WIRRE</title>
  <style>
    :root {
      --background: #0a0a0a;
      --foreground: #ffffff;
      --muted: rgba(255, 255, 255, 0.6);
      --red: #ef4444;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--background);
      color: var(--foreground);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .container {
      max-width: 400px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 32px;
      animation: fadeIn 0.5s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .icon-container {
      position: relative;
    }
    .icon {
      width: 96px;
      height: 96px;
      color: rgba(239, 68, 68, 0.8);
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .icon-blur {
      position: absolute;
      top: -16px; left: -16px; right: -16px; bottom: -16px;
      background-color: rgba(239, 68, 68, 0.1);
      filter: blur(24px);
      border-radius: 50%;
      z-index: -1;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }
    .divider {
      height: 1px;
      width: 64px;
      background-color: rgba(239, 68, 68, 0.5);
      margin: 16px auto;
    }
    p {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 32px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: bold;
    }
    .dots {
      display: flex;
      gap: 4px;
      margin-left: 4px;
    }
    .dot {
      width: 4px;
      height: 4px;
      background-color: currentColor;
      border-radius: 50%;
      animation: bounce 1s infinite;
    }
    .dot:nth-child(1) { animation-delay: -0.3s; }
    .dot:nth-child(2) { animation-delay: -0.15s; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-container">
      <div class="icon-blur"></div>
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="2" y1="2" x2="22" y2="22"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    
    <div>
      <h1>Connection Lost</h1>
      <div class="divider"></div>
      <p>
        WIRRE cannot connect to the internet.
        <br><br>
        Please check your connection. You'll automatically continue from where you left off.
      </p>
    </div>
    
    <div class="status">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
        <path d="M12 9v4"></path>
        <path d="M12 17h.01"></path>
      </svg>
      <span>Waiting for signal</span>
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('online', () => {
      window.location.reload();
    });
    // Check periodically in case event doesn't fire
    setInterval(async () => {
      if (navigator.onLine) {
        try {
          const res = await fetch(window.location.href, { method: 'HEAD', cache: 'no-store' });
          if (res.ok) {
            window.location.reload();
          }
        } catch (e) {
          // Still offline
        }
      }
    }, 3000);
  </script>
</body>
</html>
